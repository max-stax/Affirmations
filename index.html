<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#FAF7F0" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1A1814" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Affirm">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Affirmations</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&family=IBM+Plex+Sans:wght@400;500&display=swap">
<style>
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0}
[hidden]{display:none!important}
:root{
  --paper:#FAF7F0; --sheet:#FFFDF8; --ink:#2C2A26; --soft:#6E6A60; --faint:#A9A497; --rule:#E2DCCD;
  --amber:#B06F12; --amber-soft:#F3E6CF; --red:#A3452D;
  --serif:"Newsreader",Georgia,"Times New Roman",serif;
  --sans:"IBM Plex Sans",ui-sans-serif,system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root{
  --paper:#1A1814; --sheet:#24211C; --ink:#ECE5D6; --soft:#ADA593; --faint:#7A7364; --rule:#37322A;
  --amber:#E2A24B; --amber-soft:#3A2E1C; --red:#E58A72; color-scheme:dark}}
body{background:var(--paper);color:var(--ink);font-family:var(--serif);font-size:17px;line-height:1.5;-webkit-tap-highlight-color:transparent}
.wrap{max-width:560px;margin:0 auto;padding:calc(18px + env(safe-area-inset-top,0px)) max(22px,env(safe-area-inset-right,0px)) calc(60px + env(safe-area-inset-bottom,0px)) max(22px,env(safe-area-inset-left,0px))}
button{font:inherit;color:inherit;background:none;border:none;padding:0;cursor:pointer}
button:focus-visible,textarea:focus-visible{outline:2px solid var(--amber);outline-offset:3px;border-radius:4px}

/* Focus tabs: like the ribbon tabs of a notebook */
.tabs{display:flex;gap:22px;overflow-x:auto;scrollbar-width:none;margin:0 -22px;padding:0 22px 2px;border-bottom:1px solid var(--rule)}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;font-family:var(--sans);font-size:.8rem;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);padding:10px 0 9px;border-bottom:2px solid transparent;margin-bottom:-1px}
.tab[aria-current="true"]{color:var(--ink);border-color:var(--amber)}
.tab.add{color:var(--amber)}

header.page{display:flex;justify-content:space-between;align-items:flex-start;margin:30px 0 6px}
h1{font-weight:400;font-size:2.4rem;line-height:1.1;margin:0;letter-spacing:-.01em}
.date{font-family:var(--sans);font-size:.8rem;color:var(--soft);margin:6px 0 0}
.more{font-family:var(--sans);font-size:1.3rem;color:var(--soft);padding:4px 2px 4px 14px;line-height:1}
.meta{font-family:var(--sans);font-size:.78rem;color:var(--faint);margin:14px 0 4px;display:flex;justify-content:space-between}
.meta button{color:var(--soft);font-size:.78rem}

ol.lines{list-style:none;margin:0;padding:0}
.line{display:grid;grid-template-columns:2.2rem 1fr;border-top:1px solid var(--rule);padding:16px 0 14px;animation:ink .7s ease both}
.line:last-child{border-bottom:1px solid var(--rule)}
@keyframes ink{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.line{animation:none}}
.num{font-style:italic;color:var(--amber);font-size:.95rem;padding-top:3px}
.txt{font-size:1.28rem;line-height:1.42;text-align:left;white-space:pre-wrap;width:100%}
.line.pinned .num{font-style:normal;font-size:.9rem;padding-top:5px}
.line.pinned .txt{font-weight:500}
.line.lastpin{border-bottom:1px solid var(--amber)}

.write{display:grid;grid-template-columns:2.2rem 1fr;padding:16px 0;border-bottom:1px solid var(--rule)}
.write .num{color:var(--faint)}
textarea{font:inherit;font-size:1.28rem;line-height:1.42;color:var(--ink);background:transparent;border:none;padding:0;width:100%;resize:none;min-height:1.8em}
textarea::placeholder{color:var(--faint);font-style:italic}
.write .go{grid-column:2;justify-self:start;margin-top:8px;font-family:var(--sans);font-size:.85rem;color:var(--amber);font-weight:500}

.empty{padding:40px 0;text-align:center}
.empty p{font-style:italic;color:var(--soft);font-size:1.15rem;margin:0 0 18px}
.pill{font-family:var(--sans);font-size:.88rem;font-weight:500;border:1px solid var(--amber);color:var(--amber);border-radius:999px;padding:9px 18px}

details.int{margin-top:34px}
details.int summary{font-style:italic;color:var(--soft);cursor:pointer;list-style:none}
details.int summary::-webkit-details-marker{display:none}
details.int .line .txt{color:var(--soft);font-size:1.1rem}
details.int .num{color:var(--faint)}

/* Bottom sheet */
.scrim{position:fixed;inset:0;background:rgba(20,16,10,.35);z-index:5;animation:fade .2s ease both}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--sheet);border-radius:18px 18px 0 0;max-height:85vh;overflow:auto;padding:10px 24px calc(24px + env(safe-area-inset-bottom,0px));animation:up .25s ease both;max-width:560px;margin:0 auto}
@keyframes fade{from{opacity:0}}
@keyframes up{from{transform:translateY(30px);opacity:0}}
.grab{width:38px;height:4px;border-radius:2px;background:var(--rule);margin:0 auto 16px}
.sheet h3{font-weight:400;font-size:1.3rem;line-height:1.4;margin:0 0 4px}
.sheet .sub{font-family:var(--sans);font-size:.78rem;color:var(--faint);margin:0 0 14px}
.opts{display:grid;margin-top:14px;border-top:1px solid var(--rule)}
.opts button,.opts a{font-family:var(--sans);font-size:.95rem;text-align:left;padding:14px 0;border-bottom:1px solid var(--rule);color:var(--ink);text-decoration:none}
.opts .danger{color:var(--red)}
.sheet textarea{border:1px solid var(--rule);border-radius:10px;padding:10px 12px;min-height:5em;background:var(--paper)}
.row{display:flex;gap:18px;margin-top:12px;font-family:var(--sans);font-size:.92rem}
.row .primary{color:var(--amber);font-weight:500}
.hist p{margin:10px 0 0;padding-left:12px;border-left:2px solid var(--rule);color:var(--soft);font-size:1rem}
.hist small{font-family:var(--sans);font-size:.72rem;color:var(--faint)}
.help{font-family:var(--sans);font-size:.85rem;color:var(--soft);line-height:1.55}
.help ol{padding-left:18px;margin:6px 0}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);font-family:var(--sans);font-size:.85rem;padding:9px 16px;border-radius:999px;z-index:9}
</style>
</head>
<body>
<div class="wrap">
  <nav class="tabs" id="tabs" aria-label="Focus areas"></nav>
  <main id="main"></main>
</div>
<div id="sheetRoot"></div>
<input type="file" id="importFile" accept="application/json,.json" hidden>

<script>
const KEY = "affirm-v1";
const $ = s => document.querySelector(s);
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt = t => new Date(t).toLocaleDateString(undefined, {month:"short", day:"numeric", year:"numeric"});
const roman = n => { let r = "", m = [[1000,"m"],[900,"cm"],[500,"d"],[400,"cd"],[100,"c"],[90,"xc"],[50,"l"],[40,"xl"],[10,"x"],[9,"ix"],[5,"v"],[4,"iv"],[1,"i"]]; for (const [v, s] of m) while (n >= v) { r += s; n -= v; } return r + "."; };
const SORTS = {new: "newest first", old: "oldest first", shuffle: "shuffled"};

let S;
try { S = JSON.parse(localStorage.getItem(KEY)); } catch (e) {}
if (!S || !Array.isArray(S.focuses)) S = {focuses: [], items: [], current: null, sort: "new"};
if (!(S.sort in SORTS)) S.sort = "new";
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { toast("Couldn't save"); } };
let shuffleOrder = null, animate = true;

function toast(msg) {
  const t = document.createElement("div"); t.className = "toast"; t.textContent = msg;
  document.body.appendChild(t); setTimeout(() => t.remove(), 1800);
}
const focus = () => S.focuses.find(f => f.id === S.current);
const live = id => S.items.filter(i => i.focusId === id && !i.retired);

function render() {
  if (!focus()) S.current = S.focuses[0]?.id || null;
  const f = focus();
  $("#tabs").innerHTML = S.focuses.map(x => `<button type="button" class="tab" data-f="${x.id}" aria-current="${x.id === S.current}">${esc(x.name)}</button>`).join("")
    + `<button type="button" class="tab add" data-a="newFocus">+ New</button>`;

  if (!f) {
    $("#main").innerHTML = `<header class="page"><div><h1>Affirmations</h1><p class="date">${today()}</p></div></header>
      <div class="empty"><p>Begin with a focus. Art, Samyama, abundance, whatever you're tending to.</p>
      <button type="button" class="pill" data-a="newFocus">Create a focus</button></div>`;
    return;
  }

  let items = live(f.id);
  const pinCount = items.filter(i => i.pinned).length;
  if (S.sort === "old") items.sort((a, b) => a.created - b.created);
  else if (S.sort === "new") items.sort((a, b) => b.created - a.created);
  else { if (!shuffleOrder) shuffleOrder = new Map(S.items.map(i => [i.id, Math.random()])); items.sort((a, b) => (shuffleOrder.get(a.id) ?? 0) - (shuffleOrder.get(b.id) ?? 0)); }

  items = [...items.filter(i => i.pinned).sort((x, y) => x.pinnedAt - y.pinnedAt), ...items.filter(i => !i.pinned)];
  const ret = S.items.filter(i => i.focusId === f.id && i.retired).sort((a, b) => b.retiredAt - a.retiredAt);
  let n = 0;
  const lines = items.map((i, k) => `<li class="line${i.pinned ? " pinned" : ""}${i.pinned && k === pinCount - 1 && pinCount < items.length ? " lastpin" : ""}" data-i="${i.id}" style="animation-delay:${animate ? k * 70 : 0}ms${animate ? "" : ";animation:none"}">
      <span class="num"${i.pinned ? ' aria-label="Pinned"' : ""}>${i.pinned ? "✦" : roman(++n)}</span>
      <div><button type="button" class="txt" data-a="open">${esc(i.text)}</button></div></li>`).join("");

  $("#main").innerHTML = `
    <header class="page"><div><h1>${esc(f.name)}</h1><p class="date">${today()}</p></div>
      <button type="button" class="more" data-a="menu" aria-label="Focus options">⋯</button></header>
    <div class="meta"><span>${items.length} line${items.length === 1 ? "" : "s"}${pinCount ? ` · ${pinCount} pinned` : ""}</span>
      <button type="button" data-a="sort">${SORTS[S.sort]} ▾</button></div>
    <ol class="lines">${lines}</ol>
    <div class="write"><span class="num">${roman(items.length - pinCount + 1)}</span>
      <textarea id="newText" rows="1" placeholder="Write a new line…" aria-label="New line"></textarea>
      <button type="button" class="go" data-a="add" hidden id="goBtn">Add to ${esc(f.name)}</button></div>
    ${ret.length ? `<details class="int"><summary>Integrated · ${ret.length}</summary><ol class="lines" style="margin-top:12px">${
      ret.map((i, k) => `<li class="line" data-i="${i.id}" style="animation:none"><span class="num">${roman(k + 1)}</span><div><button type="button" class="txt" data-a="open">${esc(i.text)}</button></div></li>`).join("")}</ol></details>` : ""}`;
  animate = false;
  const ta = $("#newText");
  ta.addEventListener("input", () => { ta.style.height = "auto"; ta.style.height = ta.scrollHeight + "px"; $("#goBtn").hidden = !ta.value.trim(); });
  ta.addEventListener("keydown", e => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); addItem(); } });
}
const today = () => new Date().toLocaleDateString(undefined, {weekday:"long", month:"long", day:"numeric"});

function addItem() {
  const ta = $("#newText"), text = ta.value.trim();
  if (!text || !S.current) return;
  S.items.push({id: uid(), focusId: S.current, text, pinned: false, history: [], created: Date.now(), retired: false});
  save(); render(); toast("Added");
}

/* ---------- sheets ---------- */
function sheet(html) {
  $("#sheetRoot").innerHTML = `<div class="scrim" data-a="close"></div><div class="sheet" role="dialog" aria-modal="true"><div class="grab"></div>${html}</div>`;
}
const closeSheet = () => { $("#sheetRoot").innerHTML = ""; };

function itemSheet(it, editing) {
  const hist = it.history?.length ? `<div class="hist"><p class="sub" style="margin:18px 0 0">Earlier versions</p>${
    it.history.slice().reverse().map(h => `<p>${esc(h.text)}<br><small>${fmt(h.date)}</small></p>`).join("")}</div>` : "";
  if (editing) return sheet(`<div data-i="${it.id}"><p class="sub">Edit line</p>
    <textarea id="editText">${esc(it.text)}</textarea>
    <p class="help">The old wording is kept below.</p>
    <div class="row"><button type="button" class="primary" data-a="saveEdit">Save</button><button type="button" data-a="close">Cancel</button></div>${hist}</div>`);
  if (it.retired) return sheet(`<div data-i="${it.id}"><h3>${esc(it.text)}</h3><p class="sub">Integrated ${fmt(it.retiredAt)}</p>
    <div class="opts"><button type="button" data-a="restore">Bring back into rotation</button><button type="button" class="danger" data-a="del">Delete</button></div>${hist}</div>`);
  sheet(`<div data-i="${it.id}"><h3>${esc(it.text)}</h3><p class="sub">Written ${fmt(it.created)}</p>
    <div class="opts">
      <button type="button" data-a="pin">${it.pinned ? "Unpin" : "Pin to top"}</button>
      <button type="button" data-a="edit">Edit wording</button>
      <button type="button" data-a="retire">Mark as integrated <span class="help">· it's simply true now</span></button>
      <button type="button" class="danger" data-a="del">Delete</button>
    </div>${hist}</div>`);
}

function menuSheet() {
  const f = focus();
  sheet(`<p class="sub">${esc(f.name)}</p>
    <div class="opts">
      <button type="button" data-a="rename">Rename focus</button>
      <button type="button" data-a="newFocus">New focus</button>
      <button type="button" data-a="export">Export backup</button>
      <button type="button" data-a="import">Import backup</button>
      <button type="button" data-a="reminder">Daily reminder setup</button>
      <button type="button" class="danger" data-a="delFocus">Delete this focus</button>
    </div>
    <p class="help" style="margin-top:14px">Everything is saved on this phone only. Export now and then.</p>`);
}

function reminderSheet() {
  sheet(`<h3>Daily reminder</h3><div class="help"><ol>
    <li>Open <b>Shortcuts</b> → <b>Automation</b> → <b>+</b> → <b>Time of Day</b>. Pick a time and choose <b>Run Immediately</b>.</li>
    <li>Add the action <b>Open App</b> and choose <b>Affirm</b>.</li>
    <li>Add a second one for the evening if you like.</li></ol>
    <p>If Affirm isn't in the Open App list, use <b>Show Notification</b> as the nudge instead. Avoid “Open URLs”: it opens Safari, which can't see what's saved here.</p></div>
    <div class="row"><button type="button" class="primary" data-a="close">Done</button></div>`);
}

document.addEventListener("click", async e => {
  const b = e.target.closest("button,.scrim"); if (!b) return;
  if (b.dataset.f) { S.current = b.dataset.f; animate = true; save(); render(); window.scrollTo({top: 0}); return; }
  const a = b.dataset.a; if (!a) return;
  const holder = b.closest("[data-i]");
  const it = holder && S.items.find(x => x.id === holder.dataset.i);
  const inSheet = !!b.closest(".sheet");
  switch (a) {
    case "close": return closeSheet();
    case "open": return it && itemSheet(it);
    case "pin": it.pinned = !it.pinned; it.pinnedAt = Date.now(); toast(it.pinned ? "Pinned" : "Unpinned"); break;
    case "edit": itemSheet(it, true); setTimeout(() => $("#editText")?.focus(), 50); return;
    case "saveEdit": {
      const v = $("#editText").value.trim();
      if (v && v !== it.text) { it.history.push({text: it.text, date: Date.now()}); it.text = v; }
      break;
    }
    case "retire": it.retired = true; it.pinned = false; it.retiredAt = Date.now(); toast("Moved to Integrated"); break;
    case "restore": it.retired = false; delete it.retiredAt; break;
    case "del": if (!confirm("Delete this line for good?")) return; S.items = S.items.filter(x => x !== it); break;
    case "add": return addItem();
    case "sort": { const k = Object.keys(SORTS); S.sort = k[(k.indexOf(S.sort) + 1) % k.length]; shuffleOrder = null; animate = true; break; }
    case "menu": return menuSheet();
    case "reminder": return reminderSheet();
    case "newFocus": {
      closeSheet();
      const name = (prompt("Name this focus (e.g. Art, Samyama, Abundance)") || "").trim(); if (!name) return;
      const f = {id: uid(), name}; S.focuses.push(f); S.current = f.id; save(); render(); $("#newText")?.focus(); return;
    }
    case "rename": { const f = focus(); const n = (prompt("Rename focus", f.name) || "").trim(); if (n) f.name = n; break; }
    case "delFocus": {
      const f = focus(), n = S.items.filter(i => i.focusId === f.id).length;
      if (!confirm(`Delete “${f.name}”${n ? ` and its ${n} line${n === 1 ? "" : "s"}` : ""}?`)) return;
      S.focuses = S.focuses.filter(x => x !== f); S.items = S.items.filter(i => i.focusId !== f.id); S.current = null; break;
    }
    case "export": {
      const name = `affirmations-${new Date().toISOString().slice(0, 10)}.json`;
      const file = new File([JSON.stringify(S, null, 2)], name, {type: "application/json"});
      if (navigator.canShare?.({files: [file]})) { try { await navigator.share({files: [file]}); return; } catch (err) { if (err.name === "AbortError") return; } }
      const l = document.createElement("a"); l.href = URL.createObjectURL(file); l.download = name; l.click(); return;
    }
    case "import": closeSheet(); return $("#importFile").click();
  }
  closeSheet(); save(); render();
});

$("#importFile").onchange = async e => {
  const f = e.target.files[0]; if (!f) return;
  try {
    const d = JSON.parse(await f.text());
    if (!Array.isArray(d.focuses) || !Array.isArray(d.items)) throw 0;
    if (!confirm("Replace everything here with this backup?")) return;
    S = d; animate = true; save(); render(); toast("Backup restored");
  } catch (_) { toast("That file isn't an Affirmations backup"); }
  e.target.value = "";
};
document.addEventListener("keydown", e => { if (e.key === "Escape") closeSheet(); });

render();
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
</script>
</body>
</html>
